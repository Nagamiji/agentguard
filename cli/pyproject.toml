[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard-dev"
version = "0.1.2"
description = "An honest pre-deployment reliability and security gate for AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["ai", "agents", "llm", "security", "ci", "deployment-gate"]
authors = [{ name = "AgentGuard" }]
# Keep the CLI lightweight: httpx is the cloud client and PyYAML parses the primary file
# created by `agentguard init`. Neither pulls in the control-plane server stack.
dependencies = ["httpx>=0.27", "PyYAML>=6.0"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://nagamiji.github.io/agentguard/"
Documentation = "https://nagamiji.github.io/agentguard/docs/"
Repository = "https://github.com/Nagamiji/agentguard"
Issues = "https://github.com/Nagamiji/agentguard/issues"
PyPI = "https://pypi.org/project/agentguard-dev/"

[project.scripts]
agentguard = "agentguard_cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentguard_cli*", "agentguard_core*"]
